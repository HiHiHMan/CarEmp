<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
  <script src="../assets/js/color-modes.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">

  <script type="text/javascript" src="../assets/jquery/dist/jquery.min.js"></script>
  <meta name="csrf-token" content="{{ csrf_token() }}"> 

  <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">

  <script type="text/javascript" src="../config.js?v=1.04.44"></script>
  <script type="text/javascript" src="../validate.js?v=1.04.44"></script>

  <title>Car Management</title>
  <link rel="icon" type="image/x-icon" href="../assets/icon.png">

  <style>
    @font-face {
      font-family: "Kanit";
      src: url("../assets/Fonts/Kanit/Kanit-Regular.ttf");
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;

      font-family: 'Kanit', sans-serif;
      font-size: .85rem;
      color: rgb(58, 58, 58);
      letter-spacing: 0px;
    }

    html,
    body {
      height: 100%;
      background: repeating-radial-gradient( circle at 0 0, #ffffff15, #e6e6e618 90px );
    }

    .form-signin {
      max-width: 330px;
      padding: 1rem;
    }

    .form-signin .form-floating:focus-within {
      z-index: 2;
    }

    .form-signin input[type="text"] {
      margin-bottom: -1px;
      border-bottom-right-radius: 0;
      border-bottom-left-radius: 0;
    }

    .form-signin input[type="password"] {
      margin-bottom: 10px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    @media (min-width: 768px) {
      .bd-placeholder-img-lg {
        font-size: 3.5rem;
      }
    }

    .b-example-divider {
      width: 100%;
      height: 3rem;
      background-color: rgba(0, 0, 0, .1);
      border: solid rgba(0, 0, 0, .15);
      border-width: 1px 0;
      box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
    }

    .b-example-vr {
      flex-shrink: 0;
      width: 1.5rem;
      height: 100vh;
    }

    .form-check-label {
      font-size: .7rem;
    }

    .btn-color-me {
      --bs-btn-color: #000;
      --bs-btn-bg: #e1e1e1;
      --bs-btn-border-color: #d2d2d2;
      --bs-btn-hover-color: #000;
      --bs-btn-hover-bg: #d2d2d2;
      --bs-btn-hover-border-color: #ffffff;
      --bs-btn-focus-shadow-rgb: 11, 172, 204;
      --bs-btn-active-color: #000;
      --bs-btn-active-bg: #d8d8d8;
      --bs-btn-active-border-color: #ffffff;
      --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
      --bs-btn-disabled-color: #000;
      --bs-btn-disabled-bg: #d3d3d3;
      --bs-btn-disabled-border-color: #0dcaf0
    }

    .form-floating {
      font-size: .85rem;

    }

    .fw-normal i {
      font-size: 3rem;
      margin-right: 10px;
    }
    
    .alert_login {
      color: rgb(255 72 72);
    }
    
  </style>

</head>

<body class="d-flex align-items-center ">

  <main class="form-signin w-100 m-auto">
 
  </main>

  <script>

    const account = [
      {
        user_id: 'test',
        user_pass: 'test'
      }
    ]

    let content_login = $("<form>", {
      "class": 'form_login', 
      "id" : "form-submit",
      "method" : "post",
      "autocomplete" : "off"

    }).on('submit', (event) => {
        
        event.preventDefault()
        const data = new FormData(event.currentTarget)

        let jData = { 
                        user_id: data.get('user_id'),
                        user_pass: data.get('user_pass'), 
                    }

        $.ajax({
            
            url: path_api + '/getuser?uid=' + jData.user_id,
            type: 'GET', 
            headers: {
                'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
            }, 
            success: function(response) {   
              if (response.length > 0 && jData.user_id != "" && jData.user_id != null) {

                if(response[0].Password == jData.user_pass) {

                  setCookie("UserID", response[0].UserID, 1);
                  setCookie("UserName", response[0].UserName, 1);

                  location.href = ("../")

                } else {
                  $('.alert_login').html('รหัสผ่านไม่ถูกต้อง !!!')

                }
              
              } else {
                $('.alert_login').html('ไม่พบชื่อผู้ใช้งานนี้ !!!')
                
              }

            },
            error: function(xhr, status, error) {
                console.log(error)
            }

        }); 

    }) 

    content_login.html('<h1 class="h3 mb-3 fw-normal"><i class="bx bxs-car"></i> ทะเบียนยานยนต์ </h1>\
                          <div class="form-floating">\
                            <input type="text" class="form-control" name="user_id" id="user_id" placeholder="">\
                            <label for="floatingInput">รหัสพนักงาน</label>\
                          </div>\
                          <div class="form-floating">\
                            <input type="password" class="form-control" name="user_pass" id="user_pass" placeholder="">\
                            <label for="floatingPassword">รหัสผ่าน</label>\
                          </div>\
                          <div class="alert_login"></div>\
                          <div class="form-check text-start my-3">\
                            <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">\
                            <label class="form-check-label" for="flexCheckDefault">\
                              Remember me\
                            </label>\
                          </div>\
                          <button class="btn btn-color-me w-100 py-2" type="submit">เข้าสู่ระบบ</button>')

    $('.form-signin').append(content_login)

   

  </script>
  <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
